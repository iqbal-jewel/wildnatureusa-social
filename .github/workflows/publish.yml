name: publish

# Runs hourly. Each run is a no-op unless something is actually due, so the
# schedule needs no DST handling. Post_ID idempotency stops anything being
# sent twice.
#
# GitHub throttles scheduled workflows heavily -- gaps of 91 to 254 minutes
# were measured on this repo against this hourly cron -- so neither path
# assumes it runs on time. Facebook posts are handed to Meta's own scheduler
# up to 7 days ahead and fire even if this workflow is down for a week.
# Instagram cannot be scheduled server-side, so it tolerates a post being up
# to 6 hours late (--max-late) and records anything beyond that as a visible
# skip rather than dropping it silently.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Actually publish (otherwise dry run)"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Run #172 failed after 13m55s with no clear signal why -- GitHub's own
    # default is 360 minutes, so it sat in an ambiguous state for a long time
    # rather than failing fast. A normal run (even a busy one, several reels
    # rendering+uploading at once) finishes in a few minutes; capping well
    # above that means a genuine hang now fails clearly instead of quietly.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ubuntu-latest does not ship ffmpeg (checked against the runner-images
      # tool list directly, not assumed) -- reels need it to encode frames to
      # MP4. Without this, reel scheduling fails on every run in CI while
      # working fine on any dev machine that happens to have ffmpeg on PATH.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Scheduled runs publish only when the repo variable PUBLISH_ENABLED is
      # "true", so merging this workflow does not by itself start posting.
      - name: Decide mode
        id: mode
        env:
          ENABLED: ${{ vars.PUBLISH_ENABLED }}
          MANUAL_LIVE: ${{ inputs.live }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$MANUAL_LIVE" = "true" ] && echo "flag=--live" >> "$GITHUB_OUTPUT" || echo "flag=" >> "$GITHUB_OUTPUT"
          else
            [ "$ENABLED" = "true" ] && echo "flag=--live" >> "$GITHUB_OUTPUT" || echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          WILDNATUREUSA_PAGE_ID: ${{ secrets.WILDNATUREUSA_PAGE_ID }}
          WILDNATUREUSA_PAGE_TOKEN: ${{ secrets.WILDNATUREUSA_PAGE_TOKEN }}
          WILDNATUREUSA_IG_USER_ID: ${{ secrets.WILDNATUREUSA_IG_USER_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/images
        run: |
          python -m src.publish status
          python -m src.publish schedule-fb --days 7 ${{ steps.mode.outputs.flag }}
          python -m src.publish run ${{ steps.mode.outputs.flag }}

      # if: always() -- run #172 failed partway through and this step got
      # skipped along with it, so whatever schedule-fb had already saved to
      # state.json on the runner (each post is saved individually, as it
      # completes) was discarded when the runner tore down. That risked the
      # next run not knowing a post had already been scheduled -- exactly
      # the duplicate-post hazard documented in the README -- and it meant
      # there was no record of what actually happened, so diagnosing the
      # failure took reproducing it by hand instead of just reading state.
      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
